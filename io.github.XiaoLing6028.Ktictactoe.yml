# Flatpak manifest for Ktic-tac-toe, built against the KDE runtime.
app-id: io.github.XiaoLing6028.Ktictactoe
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: ktictactoe

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

cleanup:
  - /include
  - /lib/cmake
  - '*.a'

modules:
  - name: ktictactoe
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DBUILD_TESTING=ON
    run-tests: true
    sources:
      # Builds the local checkout. For a fully reproducible release build,
      # swap this for a `type: git` source pinned to a tag + commit.
      - type: dir
        path: .
        skip:
          - .flatpak-builder
          - build
          - build-dir
          - repo
          - dist
